  <text x="30" y="322" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280">✉️ muhammadawaisghafoor98@gmail.com &#160;&#160;•&#160;&#160; 🌐 awais.devxyn.com &#160;&#160;•&#160;&#160; open to collaborate</text>
  <text x="970" y="322" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#a855f7" text-anchor="end" font-style="italic">"Code is my craft, AI is my edge." 💜</text>
