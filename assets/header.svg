  <text x="66" y="260" font-family="Menlo, Consolas, monospace" font-size="12" fill="#6b21a8">I don't just write code,</text>
  <text x="66" y="276" font-family="Menlo, Consolas, monospace" font-size="12" fill="#6b21a8">I train it to <tspan font-weight="700">think</tspan>.</text>

