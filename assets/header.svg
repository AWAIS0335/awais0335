    <rect x="840" y="25" width="130" height="105" rx="14" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5"/>
  </g>
  <text x="905" y="55" font-family="Menlo, Consolas, monospace" font-size="16" fill="#a855f7" text-anchor="middle">&lt;/&gt;</text>
  <text x="905" y="85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#374151" text-anchor="middle">KEEP BUILDING</text>
  <text x="905" y="102" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#374151" text-anchor="middle">KEEP SHIPPING</text>

