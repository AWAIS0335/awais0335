  <text x="506" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#a855f7">🚀 Currently Building</text>
  <text x="506" y="282" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#4b5563">Kissan Dost • Trovio • Medibot</text>
  <text x="506" y="298" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9ca3af">devxyn.com</text>

