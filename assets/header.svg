    <rect x="52" y="200" width="66" height="26" rx="13" fill="#fde2e2"/>
    <text x="85" y="217" fill="#c0392b" text-anchor="middle">Python</text>

    <rect x="126" y="200" width="60" height="26" rx="13" fill="#dbeafe"/>
    <text x="156" y="217" fill="#1d4ed8" text-anchor="middle">React</text>

    <rect x="194" y="200" width="76" height="26" rx="13" fill="#dcfce7"/>
    <text x="232" y="217" fill="#15803d" text-anchor="middle">FastAPI</text>

    <rect x="278" y="200" width="62" height="26" rx="13" fill="#ede9fe"/>
    <text x="309" y="217" fill="#6d28d9" text-anchor="middle">AI/ML</text>

    <rect x="348" y="200" width="56" height="26" rx="13" fill="#fce7f3"/>
    <text x="376" y="217" fill="#be185d" text-anchor="middle">RAG</text>
  </g>

  <!-- quote box -->
