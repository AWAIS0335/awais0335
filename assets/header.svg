<svg width="1000" height="330" viewBox="0 0 1000 330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fdf1f7"/>
      <stop offset="100%" stop-color="#f3e8fd"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="terminalClip"><rect x="30" y="25" width="430" height="280" rx="16"/></clipPath>
    <clipPath id="codeClip"><rect x="490" y="25" width="330" height="200" rx="14"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#a855f7" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1000" height="330" rx="24" fill="url(#bg)"/>

  <!-- Terminal card -->
  <g filter="url(#soft)">
    <rect x="30" y="25" width="430" height="280" rx="16" fill="#ffffff" stroke="#f0d9ec" stroke-width="1.5"/>
  </g>
  <g clip-path="url(#terminalClip)">
    <rect x="0" y="-40" width="430" height="40" fill="url(#scan)">
      <animate attributeName="y" values="-40;305;-40" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <circle cx="52" cy="45" r="5" fill="#f87171"/>
  <circle cx="68" cy="45" r="5" fill="#fbbf24"/>
  <circle cx="84" cy="45" r="5" fill="#34d399"/>
  <text x="52" y="80" font-family="Menlo, Consolas, monospace" font-size="14" fill="#9333ea">awais<tspan fill="#6b7280">@dev</tspan><tspan fill="#6b7280">:~$</tspan> <tspan fill="#374151">cat about.md</tspan></text>

  <text x="52" y="115" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#374151">Hi, I'm 👋</text>
  <text x="52" y="158" font-family="Brush Script MT, Segoe Script, cursive" font-size="46" fill="url(#nameGrad)">Muhammad Awais 💜</text>
  <text x="52" y="184" font-family="Menlo, Consolas, monospace" font-size="14" fill="#6b7280">Full-Stack Dev  •  AI/ML &amp; RAG Engineer</text>

