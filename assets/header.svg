    <text x="565" y="80" fill="#2563eb">buildAgent</text>
    <text x="650" y="80" fill="#374151">() {</text>
    <text x="524" y="100" fill="#dc2626">return</text>
    <text x="582" y="100" fill="#374151">(</text>
    <text x="538" y="120" fill="#374151">&lt;</text>
    <text x="546" y="120" fill="#16a34a">RAG</text>
    <text x="576" y="120" fill="#374151">&gt;</text>
    <text x="552" y="140" fill="#374151">&lt;</text>
    <text x="560" y="140" fill="#16a34a">Retrieve</text>
    <text x="628" y="140" fill="#374151">/&gt;</text>
    <text x="552" y="160" fill="#374151">&lt;</text>
    <text x="560" y="160" fill="#16a34a">Generate</text>
    <text x="630" y="160" fill="#374151">/&gt;</text>
    <text x="552" y="180" fill="#374151">&lt;</text>
    <text x="560" y="180" fill="#16a34a">Ship</text>
    <text x="600" y="180" fill="#374151">/&gt;</text>
    <text x="538" y="200" fill="#374151">&lt;/</text>
    <text x="554" y="200" fill="#16a34a">RAG</text>
    <text x="584" y="200" fill="#374151">&gt;</text>
  </g>

  <!-- top-right keep building card -->
