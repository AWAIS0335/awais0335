<svg width="1000" height="230" viewBox="0 0 1000 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1000" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fdf1f7"/>
      <stop offset="100%" stop-color="#f3e8fd"/>
    </linearGradient>
    <linearGradient id="cupGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9a8d4"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cupGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cupGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cupGrad4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="cupGrad5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="tsoft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#a855f7" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1000" height="230" rx="24" fill="url(#tbg)"/>

  <text x="30" y="42" font-family="Menlo, Consolas, monospace" font-size="14" fill="#9333ea">awais<tspan fill="#6b7280">@dev</tspan><tspan fill="#6b7280">:~$</tspan> <tspan fill="#374151">ls ./achievements</tspan></text>

  <!-- Trophy card template repeated 5x, each with its own float timing -->

  <!-- Card 1 -->
  <g transform="translate(30,60)">
    <animateTransform attributeName="transform" type="translate" values="30,60; 30,52; 30,60" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="3.2s" begin="0s" repeatCount="indefinite" additive="sum"/>
    <rect width="180" height="150" rx="16" fill="#ffffff" stroke="#f0d9ec" stroke-width="1.5" filter="url(#tsoft)"/>
    <g transform="translate(90,52)">
      <path d="M -24 -20 Q -24 10 0 14 Q 24 10 24 -20 Z" fill="url(#cupGrad1)"/>
      <path d="M -24 -16 Q -38 -16 -34 0 Q -30 8 -22 4" fill="none" stroke="url(#cupGrad1)" stroke-width="4"/>
      <path d="M 24 -16 Q 38 -16 34 0 Q 30 8 22 4" fill="none" stroke="url(#cupGrad1)" stroke-width="4"/>
      <rect x="-4" y="14" width="8" height="10" fill="url(#cupGrad1)"/>
      <rect x="-16" y="24" width="32" height="6" rx="3" fill="url(#cupGrad1)"/>
    </g>
    <text x="90" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">Full-Stack</text>
    <text x="90" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">Developer</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(225,60)">
    <animateTransform attributeName="transform" type="translate" values="225,60; 225,52; 225,60" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="3.6s" begin="0.4s" repeatCount="indefinite" additive="sum"/>
    <rect width="180" height="150" rx="16" fill="#ffffff" stroke="#f0d9ec" stroke-width="1.5" filter="url(#tsoft)"/>
    <g transform="translate(90,52)">
      <path d="M -24 -20 Q -24 10 0 14 Q 24 10 24 -20 Z" fill="url(#cupGrad2)"/>
      <path d="M -24 -16 Q -38 -16 -34 0 Q -30 8 -22 4" fill="none" stroke="url(#cupGrad2)" stroke-width="4"/>
      <path d="M 24 -16 Q 38 -16 34 0 Q 30 8 22 4" fill="none" stroke="url(#cupGrad2)" stroke-width="4"/>
      <rect x="-4" y="14" width="8" height="10" fill="url(#cupGrad2)"/>
      <rect x="-16" y="24" width="32" height="6" rx="3" fill="url(#cupGrad2)"/>
    </g>
    <text x="90" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">AI/ML &amp; RAG</text>
    <text x="90" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">Engineer</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(420,60)">
    <animateTransform attributeName="transform" type="translate" values="420,60; 420,52; 420,60" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="3.0s" begin="0.8s" repeatCount="indefinite" additive="sum"/>
    <rect width="180" height="150" rx="16" fill="#ffffff" stroke="#f0d9ec" stroke-width="1.5" filter="url(#tsoft)"/>
    <g transform="translate(90,52)">
      <path d="M -24 -20 Q -24 10 0 14 Q 24 10 24 -20 Z" fill="url(#cupGrad3)"/>
      <path d="M -24 -16 Q -38 -16 -34 0 Q -30 8 -22 4" fill="none" stroke="url(#cupGrad3)" stroke-width="4"/>
      <path d="M 24 -16 Q 38 -16 34 0 Q 30 8 22 4" fill="none" stroke="url(#cupGrad3)" stroke-width="4"/>
      <rect x="-4" y="14" width="8" height="10" fill="url(#cupGrad3)"/>
      <rect x="-16" y="24" width="32" height="6" rx="3" fill="url(#cupGrad3)"/>
    </g>
    <text x="90" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">5 Projects</text>
    <text x="90" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">Shipped</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(615,60)">
    <animateTransform attributeName="transform" type="translate" values="615,60; 615,52; 615,60" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="3.4s" begin="1.2s" repeatCount="indefinite" additive="sum"/>
    <rect width="180" height="150" rx="16" fill="#ffffff" stroke="#f0d9ec" stroke-width="1.5" filter="url(#tsoft)"/>
    <g transform="translate(90,52)">
      <path d="M -24 -20 Q -24 10 0 14 Q 24 10 24 -20 Z" fill="url(#cupGrad4)"/>
      <path d="M -24 -16 Q -38 -16 -34 0 Q -30 8 -22 4" fill="none" stroke="url(#cupGrad4)" stroke-width="4"/>
      <path d="M 24 -16 Q 38 -16 34 0 Q 30 8 22 4" fill="none" stroke="url(#cupGrad4)" stroke-width="4"/>
      <rect x="-4" y="14" width="8" height="10" fill="url(#cupGrad4)"/>
      <rect x="-16" y="24" width="32" height="6" rx="3" fill="url(#cupGrad4)"/>
    </g>
    <text x="90" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">4 Team Roles</text>
    <text x="90" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">Completed</text>
  </g>

  <!-- Card 5 -->
  <g transform="translate(810,60)">
    <animateTransform attributeName="transform" type="translate" values="810,60; 810,52; 810,60" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="3.8s" begin="1.6s" repeatCount="indefinite" additive="sum"/>
    <rect width="160" height="150" rx="16" fill="#ffffff" stroke="#f0d9ec" stroke-width="1.5" filter="url(#tsoft)"/>
    <g transform="translate(80,52)">
      <path d="M -24 -20 Q -24 10 0 14 Q 24 10 24 -20 Z" fill="url(#cupGrad5)"/>
      <path d="M -24 -16 Q -38 -16 -34 0 Q -30 8 -22 4" fill="none" stroke="url(#cupGrad5)" stroke-width="4"/>
      <path d="M 24 -16 Q 38 -16 34 0 Q 30 8 22 4" fill="none" stroke="url(#cupGrad5)" stroke-width="4"/>
      <rect x="-4" y="14" width="8" height="10" fill="url(#cupGrad5)"/>
      <rect x="-16" y="24" width="32" height="6" rx="3" fill="url(#cupGrad5)"/>
    </g>
    <text x="80" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">BS Computer</text>
    <text x="80" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#374151" text-anchor="middle">Science '27</text>
  </g>
</svg>
